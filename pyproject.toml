[project]
name = "t2-3po"
version = "0.1.0"
description = "Strategic and protocol advisory droid for t2-d2: multi-agent investment thesis review"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-ai-slim[anthropic,google]>=2.61",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "yfinance>=0.2.50",
]

[project.scripts]
t2-3po = "t2_3po.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2_3po"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
]

[tool.uv]
# Supply-chain cooldown, matching t2-d2: ignore versions published in the last 7 days
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
